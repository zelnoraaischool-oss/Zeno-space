# Supabase CLI 設定（supabase start / db reset / functions serve）
project_id = "zenospace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "https://*.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# 同じ確認済みメールの Google / GitHub は同じアカウントに連携する（ZS-AUTH-03）
enable_manual_linking = true

[auth.mfa]
# 運営コンソールは TOTP 必須（3.2）
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false
# メール OTP（ZS-AUTH-02）。本番は Resend の SMTP を設定する（17.5）
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
email_sent = 30

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

# Cloudflare Turnstile（18.3 ボット対策）
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.og-fetch]
verify_jwt = true
[functions.upload-url]
verify_jwt = true
[functions.push-dispatch]
verify_jwt = false
[functions.broadcast-dispatch]
verify_jwt = false
[functions.ai-news]
verify_jwt = false
[functions.retention]
verify_jwt = false
[functions.usage-monitor]
verify_jwt = false
[functions.saved-search-notify]
verify_jwt = false
