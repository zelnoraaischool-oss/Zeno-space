<!-- Supabase の Authentication > Email Templates > Magic Link に貼り付ける（件名：zenospace のログインコード） -->
<div style="background:#e9e8e4;padding:32px 16px;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;color:#1c3a2f">
  <div style="max-width:480px;margin:0 auto;background:#f8f7f4;border:1px solid #d8d6d0;border-radius:14px;padding:32px">
    <p style="margin:0 0 4px;font-size:20px;font-weight:600;color:#1f4a3a">zenospace</p>
    <p style="margin:0 0 24px;font-size:12px;letter-spacing:.2em;color:#4a7560">LOGIN CODE</p>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.8">ログイン画面に、次の確認コードを入力してください。</p>
    <p style="margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:.3em;color:#1f4a3a">{{ .Token }}</p>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.8">このボタンからでもログインできます（同じ端末・同じブラウザで開いてください）。</p>
    <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f4a3a;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-size:14px">ログインする</a></p>
    <p style="margin:0;font-size:12px;line-height:1.8;color:#5c6b64">コードの有効期限は1時間です。心当たりがない場合は、このメールを破棄してください。パスワードは使いません。</p>
  </div>
</div>
