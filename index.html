<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D17" />
    <meta name="description" content="つくったものが、会話のはじまりになる。作品を見つけて、制作者とそのままチャットできるコミュニティ。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="zenospace" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta property="og:site_name" content="zenospace" />
    <meta property="og:title" content="zenospace" />
    <meta property="og:description" content="つくったものが、会話のはじまりになる。" />
    <meta property="og:image" content="/icons/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>zenospace</title>
    <script>
      // 初回描画前にテーマを当てる（ちらつき防止）
      try {
        var d = JSON.parse(localStorage.getItem('zenospace:mockdb:v1') || 'null')
        var uid = localStorage.getItem('zenospace:session')
        var s = d && uid && d.userSettings.find(function (x) { return x.userId === uid })
        var pref = (s && s.theme) || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>zenospace を使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
